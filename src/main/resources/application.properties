spring.application.name=auditvault
server.port=8080

# MySQL Database Configuration
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auditvault_26Sept}
spring.datasource.url=jdbc:mysql://localhost:3306/auditvaultDB
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Data Initialization
spring.sql.init.mode=always

# JWT Configuration
app.jwt.secret=${JWT_SECRET:change-me-local-dev-32-char-secret-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# H2 Console (disabled for MySQL)
spring.h2.console.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.auditvault=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
