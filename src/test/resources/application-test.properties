# Test configuration
spring.application.name=auditvault-test

# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# SQL initialization
spring.sql.init.mode=always

# Retention configuration
app.retention.days=365

# JWT Configuration
app.jwt.secret=${JWT_SECRET:change-me-local-dev-32-char-secret-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Logging
logging.level.com.auditvault.auditvault=DEBUG
